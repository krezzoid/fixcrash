# Unit tests, type checks and the plugin's validation, on every push to master
# and every pull request. Actions are pinned by tag, Claude Code by version.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Validate the plugin and the marketplace
        env:
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
        run: |
          npx -y @anthropic-ai/claude-code@2.1.302 plugin validate --strict plugin/.claude-plugin/plugin.json
          npx -y @anthropic-ai/claude-code@2.1.302 plugin validate --strict .
